name: WARP frame experiment

on:
  workflow_dispatch:
  push:
    branches: [ci-warp-frame-exp]

env:
  FEATURES: lzma,jpegxr,imgtests
  CARGO_INCREMENTAL: '1'
  CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
  RUSTUP_WINDOWS_PATH_ADD_BIN: '1'
  ARCH: cargo nextest archive --profile ci --cargo-profile ci --workspace --locked --features lzma,jpegxr,imgtests

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt install -y $(cat .github/linux-dependencies.txt)
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "warp"
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: Use DXC for DX12 shaders
        if: runner.os == 'Windows'
        shell: bash
        run: |
          sdk=$(ls -d "/c/Program Files (x86)/Windows Kits/10/bin/"10.*/x64 | sort -V | tail -1)
          test -f "$sdk/dxcompiler.dll"
          cygpath -w "$sdk" >> $GITHUB_PATH
      - name: Build master
        shell: bash
        run: $ARCH --archive-file "$RUNNER_TEMP/master.tar.zst"
      - name: Build change
        shell: bash
        run: |
          git apply .github/exp/skip.patch
          $ARCH --archive-file "$RUNNER_TEMP/change.tar.zst"
      - name: Run master, change, master, change
        shell: bash
        env:
          RUFFLE_TEST_OPTS: "--compile-mode=compile-and-verify"
        run: |
          set +e
          for v in master change master change; do
            cargo nextest run --profile ci --no-fail-fast --archive-file "$RUNNER_TEMP/$v.tar.zst" --workspace-remap . 2>&1 | grep -E "Summary|  FAIL" | sed "s/^/[$v] /"
          done
