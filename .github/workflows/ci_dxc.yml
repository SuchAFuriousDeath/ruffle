name: DXC experiment

on:
  workflow_dispatch:
  push:
    branches: [ci-dxc-exp]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FEATURES: lzma,jpegxr,imgtests
  TEST_OPTS: --workspace --locked --no-fail-fast -j 4
  CARGO_INCREMENTAL: '1'
  CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
  RUSTUP_WINDOWS_PATH_ADD_BIN: '1'

jobs:
  test:
    name: ${{ matrix.mode }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, windows-11-arm]
        mode: [baseline, dxc]

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo output
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "dxc"
          save-if: ${{ matrix.mode == 'baseline' }}

      - name: Install cargo nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Use DXC for DX12 shaders
        if: matrix.mode == 'dxc'
        shell: bash
        run: |
          arch=$([ "$RUNNER_ARCH" = ARM64 ] && echo arm64 || echo x64)
          sdk=$(ls -d "/c/Program Files (x86)/Windows Kits/10/bin/"10.*/$arch | sort -V | tail -1)
          echo "Using DXC from $sdk"
          test -f "$sdk/dxcompiler.dll"
          test -f "$sdk/dxil.dll"
          cygpath -w "$sdk" >> $GITHUB_PATH

      - name: Build tests
        shell: bash
        run: cargo nextest run --profile ci --cargo-profile ci --workspace --locked --features ${FEATURES} --no-run

      - name: Check which compiler wgpu uses
        shell: bash
        env:
          RUST_LOG: wgpu_hal=debug
        run: cargo nextest run --profile ci --cargo-profile ci --workspace --locked --features ${FEATURES} --no-capture -E 'test(=visual/filters/blur_quality)' 2>&1 | grep -iE "Using (FXC|dynamic DXC|static DXC)" | head -3 || true

      - name: Run tests
        shell: bash
        env:
          RUFFLE_TEST_OPTS: "--compile-mode=compile-and-verify"
        run: cargo nextest run --profile ci --cargo-profile ci ${TEST_OPTS} --features ${FEATURES}

      - name: Run doctests
        shell: bash
        run: cargo test --doc --profile ci ${TEST_OPTS} --features ${FEATURES}
