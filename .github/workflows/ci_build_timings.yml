name: CI build timings experiment

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FEATURES: lzma,jpegxr,imgtests
  CARGO_INCREMENTAL: '1'
  CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
  RUSTUP_WINDOWS_PATH_ADD_BIN: '1'
  XDG_RUNTIME_DIR: ''

jobs:
  timings:
    name: Build timings / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, ubuntu-24.04]

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt install -y $(cat .github/linux-dependencies.txt)

      - name: Cache Cargo output
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "perf"
          save-if: false

      - name: Info
        shell: bash
        run: |
          rustc -vV
          cargo -V
          echo "CPUs: $(nproc 2>/dev/null || echo "$NUMBER_OF_PROCESSORS")"
          ls target/ci 2>/dev/null | head
          du -sh target 2>/dev/null || true

      - name: "1: Build like CI (incremental)"
        shell: bash
        run: |
          start=$(date +%s)
          cargo test --profile ci -p tests --locked --features ${FEATURES} --no-run --timings
          echo "STEP1_SECONDS=$(( $(date +%s) - start ))"
          mkdir -p timings && cp target/cargo-timings/cargo-timing.html timings/1-incremental.html

      - name: "2: Rebuild only the tests binary (link time)"
        shell: bash
        env:
          MSYS_NO_PATHCONV: '1'
        run: |
          touch tests/tests/regression_tests.rs
          if [ "$RUNNER_OS" = "Windows" ]; then
            link_args="-Clink-arg=-time"
          else
            link_args="-Clink-arg=-Wl,--time-trace"
          fi
          start=$(date +%s)
          cargo rustc --profile ci -p tests --test tests --locked --features ${FEATURES} --timings -- $link_args -Wlinker-messages 2>&1 | tee timings/link.log | grep -iE "time|link|Finished|error" | head -60
          echo "STEP2_SECONDS=$(( $(date +%s) - start ))"
          cp target/cargo-timings/cargo-timing.html timings/2-tests-binary.html
          trace=$(find target/ci -name "*.time-trace" -newer tests/tests/regression_tests.rs | head -1)
          if [ -n "$trace" ]; then
            cp "$trace" timings/lld.time-trace.json
            python3 -c "
          import json; d=json.load(open('timings/lld.time-trace.json'))
          ev=[e for e in d['traceEvents'] if e.get('ph')=='X' and e['name'].startswith('Total')]
          for e in sorted(ev, key=lambda e: -e['dur'])[:10]: print('%8.1f ms  %s' % (e['dur']/1000, e['name']))
          "
          fi

      - name: "3: Workspace without incremental"
        shell: bash
        run: |
          members=$(cargo metadata --no-deps --format-version 1 | python3 -c "import json,sys; print(' '.join('-p ' + p['name'] for p in json.load(sys.stdin)['packages']))")
          cargo clean --profile ci $members
          start=$(date +%s)
          CARGO_INCREMENTAL=0 cargo test --profile ci -p tests --locked --features ${FEATURES} --no-run --timings
          echo "STEP3_SECONDS=$(( $(date +%s) - start ))"
          cp target/cargo-timings/cargo-timing.html timings/3-non-incremental.html

      - name: "4: panic=unwind (incremental)"
        shell: bash
        run: |
          git apply .github/scripts/ci-panic-unwind.patch
          members=$(cargo metadata --no-deps --format-version 1 | python3 -c "import json,sys; print(' '.join('-p ' + p['name'] for p in json.load(sys.stdin)['packages']))")
          cargo clean --profile ci $members
          start=$(date +%s)
          cargo test --profile ci -p tests --locked --features ${FEATURES} --no-run --timings
          echo "STEP4_SECONDS=$(( $(date +%s) - start ))"
          cp target/cargo-timings/cargo-timing.html timings/4-unwind.html

      - name: "5: panic=unwind without incremental"
        shell: bash
        run: |
          members=$(cargo metadata --no-deps --format-version 1 | python3 -c "import json,sys; print(' '.join('-p ' + p['name'] for p in json.load(sys.stdin)['packages']))")
          cargo clean --profile ci $members
          start=$(date +%s)
          CARGO_INCREMENTAL=0 cargo test --profile ci -p tests --locked --features ${FEATURES} --no-run --timings
          echo "STEP5_SECONDS=$(( $(date +%s) - start ))"
          cp target/cargo-timings/cargo-timing.html timings/5-unwind-non-incremental.html

      - name: "6: panic=unwind + rustfft without incremental"
        shell: bash
        run: |
          git apply .github/scripts/ci-rustfft.patch
          members=$(cargo metadata --no-deps --format-version 1 | python3 -c "import json,sys; print(' '.join('-p ' + p['name'] for p in json.load(sys.stdin)['packages']))")
          cargo clean --profile ci $members
          start=$(date +%s)
          CARGO_INCREMENTAL=0 cargo test --profile ci -p tests --features ${FEATURES} --no-run --timings
          echo "STEP6_SECONDS=$(( $(date +%s) - start ))"
          cp target/cargo-timings/cargo-timing.html timings/6-unwind-rustfft.html

      - name: Upload timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: timings-${{ matrix.os }}
          path: timings/
